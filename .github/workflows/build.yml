name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile (no tests; tests need MySQL)
        working-directory: lito伺服器/LiTo381-Server
        run: mvn -B -q -DskipTests compile

  launcher:
    name: Launcher (.NET 10 / WinForms)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build "lito登入器/LiTo381-Launcher/src/LiTo381Launcher.csproj" -c Release
