name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package (no tests)
        working-directory: lito伺服器/LiTo381-Server
        # -DskipTests still compiles tests. Current test sources fail testCompile
        # (T005). -Dmaven.test.skip=true skips testCompile so package stays green.
        run: mvn -B -DskipTests -Dmaven.test.skip=true package
      - name: Compare class lists with reference JAR
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          from collections import defaultdict

          server = Path("lito伺服器/LiTo381-Server")
          ref_jar = server / "reference" / "base-0.6.71.jar"
          tgt_jar = server / "target" / "LiTo381-Server.jar"
          out = Path("docs/server-source-gap.md")

          def class_list(jar: Path) -> set[str]:
              text = subprocess.check_output(["jar", "tf", str(jar)], text=True)
              return {line.strip() for line in text.splitlines() if line.endswith(".class")}

          def top_name(entry: str) -> str:
              simple = entry.rsplit("/", 1)[-1][:-6]
              return simple.split("$", 1)[0]

          def classify_only_ref(entry: str, target_classes: set[str]) -> str:
              simple = entry.rsplit("/", 1)[-1][:-6]
              top = simple.split("$", 1)[0]
              if top.startswith("Modern"):
                  return "Modern*"
              parent = str(Path(entry).parent / f"{top}.class")
              if "$" not in simple:
                  return "待補"
              if parent in target_classes:
                  return "刻意排除"
              return "待補"

          NOTES = {
              "local/lito381/server/NativeDeVisibilitySwitch.class":
                  "頂層類；src/main 沒有對應 .java，reference/missing-classes.txt 已列。",
              "local/lito381/server/BattleInvisibilityStatus$Lease.class":
                  "現行 BattleInvisibilityStatus 把 lease 收成欄位，不再產 named inner class。",
              "local/lito381/server/BattleInvisibilityStatus$Snapshot.class":
                  "同上，現行原始碼不再產 Snapshot inner class。",
              "local/lito381/server/NativeCastMaterial$Effect.class":
                  "T002 搬入的 tools 原始碼改用 Cast + Function，不再有 Effect inner。",
              "local/lito381/server/NativeResurrectionMaterialAction$Target.class":
                  "現行用 private static method target()，不再產 Target inner class。",
              "local/lito381/server/BattleDeathmatchFatalityCatalog$1.class":
                  "外層類已在 target；現行用 enum Family/Effect，匿名 $1 不再出現。",
              "local/lito381/server/BattleTimeAttackMagicSkillCatalog$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
              "local/lito381/server/ClassicWorldCkewCatalog$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
              "local/lito381/server/ClassicWorldMonsterMagicSkillCatalog$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
              "local/lito381/server/InventoryCatalog$1.class":
                  "外層類已在 target；現行有 enum Effect，不再產匿名 $1。",
              "local/lito381/server/NativeDeAiState$2.class":
                  "外層類已在 target；現行用 record/enum，匿名類編號不同。",
              "local/lito381/server/NativeDeDeletionVisibility$1.class":
                  "外層類已在 target；現行有 named Snapshot，匿名 $1 不再出現。",
              "local/lito381/server/NativeDeEquipment$1.class":
                  "外層類已在 target；現行用 record，匿名 $1 不再出現。",
              "local/lito381/server/NativeDeWorldCore$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
              "local/lito381/server/NativeDeWorldPlayerFilter$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
              "local/lito381/server/NativeLitoRentalTownNpcCatalog$1.class":
                  "外層類已在 target；匿名類編號／寫法與正式 JAR 不同。",
          }

          ref = class_list(ref_jar)
          tgt = class_list(tgt_jar)
          only_ref = sorted(ref - tgt)
          only_tgt = sorted(tgt - ref)
          both = ref & tgt

          by_cat = defaultdict(list)
          for entry in only_ref:
              by_cat[classify_only_ref(entry, tgt)].append(entry)

          modern_tgt = [e for e in only_tgt if top_name(e).startswith("Modern")]
          other_tgt = [e for e in only_tgt if not top_name(e).startswith("Modern")]

          def fence(entries):
              if not entries:
                  return "_（無）_\n"
              return "```\n" + "\n".join(entries) + "\n```\n"

          lines = [
              "# 伺服器來源缺口（T007 / Issue #2）",
              "",
              "用 `jar tf` 比對 Maven 產物與正式 0.6.71 參考 JAR 的 `.class` 清單。",
              "此檔由 CI `package` 後重寫，並以 artifact `server-source-gap` 上傳。",
              "",
              "## 比對基準",
              "",
              "| 項目 | 路徑 |",
              "|---|---|",
              f"| reference | `{ref_jar.as_posix()}` |",
              f"| target | `{tgt_jar.as_posix()}` |",
              "| 指令 | `jar tf <jar>`，只保留 `*.class` |",
              "| 建置 | `mvn -B -DskipTests -Dmaven.test.skip=true package` |",
              "",
              "## 摘要",
              "",
              "| 集合 | 數量 |",
              "|---|---|",
              f"| reference `.class` | {len(ref)} |",
              f"| target `.class` | {len(tgt)} |",
              f"| 交集 | {len(both)} |",
              f"| 只在 reference | {len(only_ref)} |",
              f"| 只在 target | {len(only_tgt)} |",
              "",
              "### 只在 reference 分類計數",
              "",
              "| 類別 | 數量 | 含義 |",
              "|---|---|---|",
              f"| Modern* | {len(by_cat['Modern*'])} | 正式 JAR 有、現行 src 標為 Modern 候選 |",
              f"| 刻意排除 | {len(by_cat['刻意排除'])} | 外層類已在 target；inner／匿名類形狀與正式 JAR 不同 |",
              f"| 待補 | {len(by_cat['待補'])} | 頂層類或外層類不在 target，需補來源 |",
              "",
              "## 已驗證／推測／待驗證",
              "",
              "- **已驗證**：`unzip -p reference/base-0.6.71.jar META-INF/MANIFEST.MF` 的 `Main-Class` 為 `local.lito381.server.SharedResourceMain`；`mvn package` 產物 MANIFEST 同樣寫入此 Main-Class，`Implementation-Version` 為 `0.6.71`。本清單由 `jar tf` 對兩個 JAR 的 `.class` 路徑做集合差。",
              "- **推測**：標「刻意排除」的 inner／匿名類是 javac 對現行原始碼（T002 反編譯或 tools 原文）編出的形狀不同，不是少了一整個頂層型別。",
              "- **待驗證**：類別清單一致不等於位元組碼／行為一致；未跑 `1.啟動伺服器.bat --check`／`--smoke`，未連正式 DB，未啟動遊戲。",
              "",
              "## 只在 reference",
              "",
          ]

          for cat in ("待補", "刻意排除", "Modern*"):
              entries = by_cat[cat]
              lines.append(f"### {cat}（{len(entries)}）")
              lines.append("")
              if not entries:
                  lines.append("_（無）_")
                  lines.append("")
                  continue
              lines.append("| 類別 | 說明 |")
              lines.append("|---|---|")
              for entry in entries:
                  note = NOTES.get(entry, "依分類規則標註；外層類已在 target 則為刻意排除，否則待補。")
                  lines.append(f"| `{entry}` | {note} |")
              lines.append("")

          lines.extend([
              "## 只在 target",
              "",
              f"### Modern*（{len(modern_tgt)}）",
              "",
              "現行 `src/main` 的 Modern 候選堆疊；正式 0.6.71 JAR 不含。刻意保留在 Maven 產物（另有 `LiTo381-Server-modern.jar` classifier）。",
              "",
              fence(modern_tgt),
              f"### 其他非 Modern（{len(other_tgt)}）",
              "",
              "src/main 多出來、正式 JAR 沒有的輔助型別（裝備規則、競技場存在感、外觀依賴解析等）。",
              "",
              fence(other_tgt),
          ])

          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding="utf-8")
          print(f"wrote {out} only_ref={len(only_ref)} only_tgt={len(only_tgt)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: server-source-gap
          path: docs/server-source-gap.md

  # Issue #357 / T126: reproducible packaging. Build the same commit twice
  # (clean in between so nothing is reused from target/) and require every
  # JAR to have the same SHA-256. Relies on project.build.outputTimestamp.
  server-reproducible:
    name: Server reproducible JAR (build twice, compare SHA-256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build twice and compare
        working-directory: lito伺服器/LiTo381-Server
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/repro"
          mkdir -p "$out/1" "$out/2"
          for round in 1 2; do
            echo "::group::mvn package round $round"
            mvn -B -DskipTests clean package
            echo "::endgroup::"
            cp target/*.jar "$out/$round/"
            # sleep so any wall-clock timestamp leak would show up as a diff
            if [ "$round" = 1 ]; then sleep 3; fi
          done
          (cd "$out/1" && sha256sum *.jar | sort -k2) | tee "$out/round1.sha256"
          (cd "$out/2" && sha256sum *.jar | sort -k2) | tee "$out/round2.sha256"
          count=$(wc -l < "$out/round1.sha256")
          if [ "$count" -lt 3 ]; then
            echo "::error::expected at least 3 JARs (main, modern, as-record-tests), got $count"
            exit 1
          fi
          if ! diff -u "$out/round1.sha256" "$out/round2.sha256"; then
            echo "::error::JAR SHA-256 differs between two builds of the same commit"
            for jar in "$out"/1/*.jar; do
              name=$(basename "$jar")
              if ! cmp -s "$jar" "$out/2/$name"; then
                echo "--- $name entries (name/size/date) round1 vs round2"
                diff <(unzip -lv "$jar") <(unzip -lv "$out/2/$name") || true
              fi
            done
            exit 1
          fi
          echo "reproducible: $count JARs identical across two builds"
          mkdir -p target
          cp "$out/round1.sha256" target/reproducible-jars.sha256
          git rev-parse HEAD > target/reproducible-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-reproducible-jars
          path: |
            lito伺服器/LiTo381-Server/target/reproducible-jars.sha256
            lito伺服器/LiTo381-Server/target/reproducible-revision.txt
          if-no-files-found: warn

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    # T131 (#382): a normal run takes about 10 minutes. Without a limit a hung
    # test holds the job until GitHub's 6 hour cap and blocks the merge gate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test (MySQL and local-file tests skipped)
        working-directory: lito伺服器/LiTo381-Server
        # Step limit below the job limit: a timed-out step fails (not "cancelled"),
        # so the summary and evidence upload steps still run.
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          git rev-parse HEAD | tee target/test-revision.txt
          mvn -B test 2>&1 | tee target/mvn-test.log
      - name: Summarise skips (baseline without MySQL)
        if: always()
        run: |
          python3 .github/workflows/scripts/surefire_summary.py \
            lito伺服器/LiTo381-Server/target/surefire-reports \
            lito伺服器/LiTo381-Server/target/surefire-summary.json no-mysql
      - name: Upload complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-evidence
          path: |
            lito伺服器/LiTo381-Server/target/test-revision.txt
            lito伺服器/LiTo381-Server/target/mvn-test.log
            lito伺服器/LiTo381-Server/target/surefire-summary.json
            lito伺服器/LiTo381-Server/target/surefire-reports/

  # Issue #334 / T119: same `mvn -B test`, but with a disposable MySQL and a
  # CI-only config/server.properties, so tests guarded by
  # LocalResources.assumeServerProperties() actually run.
  # MySQL 5.7: every dump in db/ and 1-伺服器/db/*.sql is "Source Server
  # Version 50522 (5.5.22)" with MyISAM tables and 5.5-era defaults; 5.7 is the
  # closest maintained image (8.0 changes default auth, reserved words and
  # utf8 handling). sql_mode is cleared to match the 5.5 server default.
  # Credentials below are fixed, non-secret test values for this throwaway
  # container only; they are not used by any real deployment.
  # Non-blocking until the follow-up of #334 fixes the 73 cases listed in
  # docs/reports/issue-334.md; Maven still exits non-zero so the job shows red.
  server-integration-test:
    name: Server tests (CI MySQL fixture, non-blocking until #334 follow-up)
    runs-on: ubuntu-latest
    continue-on-error: true
    # T131 (#382): normal run about 10 minutes; runs 43264734337 / 43264755522 /
    # 43264993090 hung for 6 hours behind a JVM-wide deadlock and ended "cancelled".
    timeout-minutes: 30
    env:
      LITO_CI_DB_ROOT_PASSWORD: lito_ci_root_test_only
      LITO_CI_DB_USER: lito_ci
      LITO_CI_DB_PASSWORD: lito_ci_test_only
      LITO_CI_DB_PORT: '33306'
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: lito_ci_root_test_only
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -plito_ci_root_test_only"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build CI database fixture (schema + fake rows, runner temp only)
        shell: bash
        run: |
          set -euo pipefail
          python3 lito伺服器/LiTo381-Server/db/ci/build_ci_database.py \
            --out "$RUNNER_TEMP/lito-ci/sql" \
            --user "$LITO_CI_DB_USER" --password "$LITO_CI_DB_PASSWORD"
      - name: Load fixture into MySQL
        shell: bash
        run: |
          set -euo pipefail
          container='${{ job.services.mysql.id }}'
          sql() { docker exec -i "$container" mysql --default-character-set=utf8mb4 -uroot -p"$LITO_CI_DB_ROOT_PASSWORD" "$@"; }
          sql -e "SET GLOBAL sql_mode=''; SELECT VERSION(), @@GLOBAL.sql_mode;"
          for file in "$RUNNER_TEMP"/lito-ci/sql/*.sql; do
            echo "::group::load $(basename "$file")"
            start=$(date +%s)
            sql < "$file"
            echo "loaded in $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          done
          sql -e "SELECT table_schema, COUNT(*) AS tables FROM information_schema.TABLES WHERE table_schema IN ('380_db','380_lito','380_ac','380_ac_1','380_ac_2') GROUP BY table_schema; SELECT * FROM \`380_lito\`.lito_source_server; SELECT COUNT(*) AS fake_characters FROM \`380_ac\`.characters;"
      - name: Generate CI-only config/server.properties (runner temp, symlinked)
        working-directory: lito伺服器/LiTo381-Server
        shell: bash
        run: |
          set -euo pipefail
          python3 db/ci/make_ci_server_properties.py \
            --out "$RUNNER_TEMP/lito-ci/config/server.properties" \
            --jdbc-base-url "jdbc:mysql://127.0.0.1:${LITO_CI_DB_PORT}/" \
            --user "$LITO_CI_DB_USER" --password "$LITO_CI_DB_PASSWORD"
          test ! -e config/server.properties
          ln -s "$RUNNER_TEMP/lito-ci/config/server.properties" config/server.properties
          git check-ignore -q config/server.properties
      - name: Test with CI MySQL fixture
        working-directory: lito伺服器/LiTo381-Server
        # Step limit below the job limit: a timed-out step fails (not "cancelled"),
        # so the summary and evidence upload steps still run.
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          git rev-parse HEAD | tee target/test-revision.txt
          mvn -B test 2>&1 | tee target/mvn-test.log
      - name: Summarise skips (with CI MySQL)
        if: always()
        run: |
          python3 .github/workflows/scripts/surefire_summary.py \
            lito伺服器/LiTo381-Server/target/surefire-reports \
            lito伺服器/LiTo381-Server/target/surefire-summary.json ci-mysql
      - name: Upload complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-test-evidence
          path: |
            lito伺服器/LiTo381-Server/target/test-revision.txt
            lito伺服器/LiTo381-Server/target/mvn-test.log
            lito伺服器/LiTo381-Server/target/surefire-summary.json
            lito伺服器/LiTo381-Server/target/surefire-reports/

  semantic-gap:
    name: Semantic gap (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Self-test
        run: |
          set -o pipefail
          mkdir -p scratch
          git rev-parse HEAD | tee scratch/semantic-diff-revision.txt
          java -version 2>&1 | tee scratch/semantic-diff-java.txt
          bash lito伺服器/LiTo381-Server/tools/semantic-diff/selftest.sh 2>&1 | tee scratch/semantic-diff-selftest.log
      - name: Self-test without Maven (cold javac fallback)
        run: |
          set -o pipefail
          bash lito伺服器/LiTo381-Server/tools/semantic-diff/selftest-fallback.sh 2>&1 | tee scratch/semantic-diff-fallback.log
      - name: Package server (no tests)
        working-directory: lito伺服器/LiTo381-Server
        run: mvn -B -DskipTests package
      - name: Semantic compare Maven product vs reference
        run: |
          set -o pipefail
          sha256sum lito伺服器/LiTo381-Server/target/LiTo381-Server.jar lito伺服器/LiTo381-Server/reference/base-0.6.71.jar | tee scratch/semantic-diff-inputs.sha256
          bash "lito伺服器/LiTo381-Server/tools/semantic-diff/semantic-diff" \
            --left "lito伺服器/LiTo381-Server/target/LiTo381-Server.jar" \
            --right "lito伺服器/LiTo381-Server/reference/base-0.6.71.jar" \
            --json scratch/server-semantic-gap.json \
            --md docs/server-semantic-gap.md 2>&1 | tee scratch/semantic-diff-compare.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-semantic-gap
          path: |
            docs/server-semantic-gap.md
            scratch/server-semantic-gap.json
            scratch/semantic-diff-*.txt
            scratch/semantic-diff-*.sha256
            scratch/semantic-diff-*.log
            scratch/semantic-diff-selftest.*/*.json
            scratch/semantic-diff-selftest.*/*.log*
            scratch/semantic-diff-fallback.*/*.json
            scratch/semantic-diff-fallback.*/*.out
            scratch/semantic-diff-fallback.*/*.err
          if-no-files-found: warn

  # Issue #398 / T139: offline checks for the #31 combat regression entry
  # points (tools/combat-continuation). No JAR execution, no SQL, no fixtures:
  # syntax, CLI parameters, JDK lookup via PATH, and test_formal_protection.py.
  combat-regression-tools:
    name: Combat regression tools (offline, no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: lito伺服器/LiTo381-Server/tools/combat-continuation
    env:
      ENTRIES: >-
        full_regression.py candidate_regression.py affected_regressions.py
        replay_composed_materials.py reconcile_replay.py
        cancellation-battle-runtime/replay_targeted.py
        cancellation-battle-runtime/replay_player_cancellation.py
        cancellation-battle-runtime/test_curse_clock_boundary.py
        cancellation-battle-runtime/seal_validation.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -B -m py_compile regression_support.py test_formal_protection.py $ENTRIES
      - name: Entry points expose --jar / --out / --config / --resources
        run: |
          set -euo pipefail
          for entry in $ENTRIES; do
            help=$(python -B -X utf8 "$entry" --help)
            for flag in --jar --out --config --resources; do
              grep -q -- "$flag" <<<"$help" || { echo "::error::$entry --help lacks $flag"; exit 1; }
            done
            echo "ok $entry"
          done
          python -B -X utf8 reconcile_replay.py --help | grep -q -- --manifest
      - name: JDK resolved from PATH when JAVA_HOME is unset
        run: |
          set -euo pipefail
          env -u JAVA_HOME python -B - <<'PY'
          import shutil, subprocess
          import regression_support as s
          java = s.java_tool('java')
          assert java == shutil.which('java'), java
          subprocess.run([java, '-version'], check=True)
          legacy = "x = Path(r'C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot/bin/java.exe')\n"
          adapted = s.adapt_driver(legacy, '/tmp/isolated.properties')
          assert "java_tool('java')" in adapted and 'jdk-17' not in adapted, adapted
          print('java_tool ->', java)
          PY
      - name: Offline formal-protection tests
        run: python -B -X utf8 -m unittest -v test_formal_protection

  launcher:
    name: Launcher (.NET 10 / WinForms)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build "lito登入器/LiTo381-Launcher/src/LiTo381Launcher.csproj" -c Release
      # T140 / Issue #404: pure unit tests (no GUI, no Server, no LiTo.bin).
      - name: Unit tests (.NET)
