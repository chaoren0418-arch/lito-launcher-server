name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    # 目前 src/main 不是完整來源（見 TASKS.md T002），此 job 先不阻擋；T002 完成後移除 continue-on-error。
    name: Server (Java 17 / Maven) — non-blocking until T002
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Stage SharedDatabase.java (lives in tools/shared-database, not src/main)
        working-directory: lito伺服器/LiTo381-Server
        run: cp tools/shared-database/SharedDatabase.java src/main/java/local/lito381/server/
      - name: Compile (no tests; tests need MySQL)
        working-directory: lito伺服器/LiTo381-Server
        run: mvn -B -q -DskipTests compile

  launcher:
    name: Launcher (.NET 10 / WinForms)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build "lito登入器/LiTo381-Launcher/src/LiTo381Launcher.csproj" -c Release
