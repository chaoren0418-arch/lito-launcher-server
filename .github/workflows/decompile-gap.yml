name: decompile-gap
# T002 輔助：把正式 JAR 中、src/main 沒有來源的類別用 CFR 反編譯成 artifact，供整併審查。
on:
  workflow_dispatch:
  push:
    branches: [feat/T002-server-source]
    paths: ['.github/workflows/decompile-gap.yml']

permissions:
  contents: write

jobs:
  cfr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lito伺服器/LiTo381-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch CFR 0.152
        run: curl -sSL -o /tmp/cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
      - name: Class list diff (jar vs src/main)
        run: |
          unzip -l reference/base-0.6.71.jar | awk '{print $4}' | grep '\.class$' | sed 's#local/lito381/server/##; s/\.class$//' | grep -v '\$' | sort > /tmp/jar.txt
          ls src/main/java/local/lito381/server/*.java | xargs -n1 basename | sed 's/\.java$//' | sort > /tmp/src.txt
          comm -23 /tmp/jar.txt /tmp/src.txt > /tmp/missing.txt
          comm -13 /tmp/jar.txt /tmp/src.txt > /tmp/extra.txt
          echo "missing=$(wc -l < /tmp/missing.txt) extra=$(wc -l < /tmp/extra.txt)"
      - name: Decompile missing classes
        run: |
          mkdir -p /tmp/out /tmp/sel
          cd /tmp/sel && unzip -q -o "$GITHUB_WORKSPACE/lito伺服器/LiTo381-Server/reference/base-0.6.71.jar" 'local/lito381/server/*'
          while read c; do ls local/lito381/server/$c.class local/lito381/server/$c\$*.class 2>/dev/null || true; done < /tmp/missing.txt > /tmp/files.txt
          echo "class files: $(wc -l < /tmp/files.txt)"
          java -jar /tmp/cfr.jar $(cat /tmp/files.txt) --outputdir /tmp/out --comments false --silent true
          find /tmp/out -name '*.java' | wc -l
          cp /tmp/missing.txt /tmp/extra.txt /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: decompiled-gap
          path: /tmp/out
      - name: Commit decompiled sources to branch bot/T002-decompiled
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/T002-decompiled
          dst="lito伺服器/LiTo381-Server/src/main/java/local/lito381/server"
          n=0
          for f in $(find /tmp/out/local/lito381/server -maxdepth 1 -name '*.java'); do
            b=$(basename "$f")
            [ -e "$dst/$b" ] && continue
            { echo "// DECOMPILED (CFR 0.152) from reference/base-0.6.71.jar — TODO: replace with original source (T002)"; cat "$f"; } > "$dst/$b"
            n=$((n+1))
          done
          echo "added $n files"
          git add "$dst"
          git commit -m "T002: 以 CFR 反編譯補入正式 JAR 中 src/main 缺少的 $n 個類別（待以原始碼替換）" -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" || echo "nothing to commit"
          git push -f origin bot/T002-decompiled
