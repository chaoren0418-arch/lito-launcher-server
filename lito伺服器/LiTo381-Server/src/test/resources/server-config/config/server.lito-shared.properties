# LiTo production-shaped database layout: one static schema, many dynamic schemas.
bind=127.0.0.1
game.bind=127.0.0.2
port=32000
advertised.host=127.0.0.2
advertised.port=32000
server.name=LiTo 3.81C Shared World
origin.source.id=lito-shared
origin.source.name=LiTo 共用資料架構
login.classic.server.names=380 角色庫 1,380 角色庫 2
login.classic.server.ids=1,2
login.bootstrap.sequence=login_check,classic_server_list,lito_server_list
login.bootstrap.step.delay.ms=250
lobby.character.list.enabled=true
capture.directory=../../../../../target/test-runtime/captures
maps.directory=../../../../../maps

# Credentials and JDBC options are shared with the 380 server, but schema
# ownership is explicit: lito_static is immutable game data; every 380_ac_N is
# an independent account/character world selected by the native C_C8 source.
database.mode=lito_mysql
database.connection.properties=../../../../../../1-伺服器/config/sql.properties
database.static.database=lito_static
database.dynamic.databases=380_ac_1,380_ac_2
database.source.weight.rates=100.0,100.0
database.read.only=true

# The shared TW dynamic schemas are intentionally read-only. Writable repository
# paths are exercised only against generated test schemas or a future explicitly
# separate LiTo-owned deployment. Source-qualified character, pet, account and
# clan warehouse projections are memory-only and are evicted when their last
# matching live session leaves; shared world/event state remains durable.
state.file=../../../../../target/test-runtime/server-state-lito-shared.properties
state.persistence.enabled=true

battle.ai.enabled=false
battle.physical.hit.enabled=true
battle.natural.mp.regen.enabled=true
classic.world.compatibility.enabled=true
classic.world.monster.ai.enabled=true
classic.world.monster.ai.tick.ms=100
native.siege.roster.enforced=true
native.tournament.economy.enabled=true
native.tournament.allowance=20000

lito.rental.teleport.routes=
lito.rental.handoff.file=
administration.accounts=
