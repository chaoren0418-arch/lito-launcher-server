bind=127.0.0.1
game.bind=127.0.0.2
port=32100
advertised.host=127.0.0.2
advertised.port=32100
server.name=LiTo 3.81C Native Source UI Probe
# Display the two retained original character-source names in LiTo.bin while
# keeping this visual probe independent from real account credentials.
login.classic.server.names=完美天堂,完美天堂2
login.classic.server.ids=1,2
max.frame=8192
version.response.delay.ms=0
# The standalone physical-login probe clears the launcher's cached-source bit
# after the native login button sets it.  The official launcher normally owns
# that handoff; this bounded loopback delay gives the probe one polling window
# before S_SERVER_LIST is parsed and does not affect production profiles.
login.bootstrap.initial.delay.ms=500
login.bootstrap.step.delay.ms=0
# /ltcharsvr uses the classic S_00 acceptance before the retained source list.
# The redirected GAME endpoint owns the separate LiTo character-page bootstrap.
login.bootstrap.sequence=login_check,classic_server_list
login.notice.message.ids=
lobby.server.select.response.delay.ms=0
lobby.enter.channel.response.enabled=true
lobby.enter.channel.response.delay.ms=0
lobby.character.list.enabled=true
capture.directory=../../../../../target/test-runtime/native-source-ui-probe-captures
# UI-only fixture. The separate server.source-router-legacy-probe.properties
# profile proves that each displayed source maps to its retained read-only DB.
database.mode=memory
database.read.only=true
memory.account=test
memory.password=test
state.file=../../../../../target/test-runtime/native-source-ui-probe-state.properties
state.persistence.enabled=false
battle.ai.enabled=false
battle.ai.tick.ms=900
battle.ai.damage=5
battle.reward.win=250
battle.reward.loss=50
native.integrity.pre-world.probe=true
# S_04 is the legacy /ltcharsvr compatibility event, not a source-list
# terminator.  Sending it here closes the retained-source modal and displays
# the native "channel is not in service" warning, so the source UI fixture
# must leave that independent diagnostic disabled.
native.character.event.probe.enabled=false
native.source.selection.probe.enabled=true
administration.accounts=test
