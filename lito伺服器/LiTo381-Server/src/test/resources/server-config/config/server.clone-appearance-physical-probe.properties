# Isolated original-client visual acceptance fixture for S_CLONE.
# It combines the proved /ltcharsvr retained-source handoff with the existing
# memory/read-only/non-persistent clone receiver probe. Production profiles do
# not include this file and keep clone.appearance.probe.enabled=false.
bind=127.0.0.1
game.bind=127.0.0.2
port=32100
advertised.host=127.0.0.2
advertised.port=32100
server.name=LiTo 3.81C Clone Physical Probe
login.classic.server.names=完美天堂,完美天堂2
login.classic.server.ids=1,2
max.frame=8192
version.response.delay.ms=0
login.bootstrap.initial.delay.ms=500
login.bootstrap.step.delay.ms=0
login.bootstrap.sequence=login_check,classic_server_list
login.notice.message.ids=
lobby.server.select.response.delay.ms=0
lobby.enter.channel.response.enabled=true
# Preserve the native room-identity handoff before the diagnostic mutation.
lobby.enter.channel.response.delay.ms=1500
lobby.character.list.enabled=true
capture.directory=../../../../../target/test-runtime/clone-appearance-physical-probe-captures
database.mode=memory
database.read.only=true
memory.account=test
memory.password=test
state.file=../../../../../target/test-runtime/clone-appearance-physical-probe-state.properties
state.persistence.enabled=false
battle.ai.enabled=false
battle.ai.tick.ms=900
battle.ai.damage=5
battle.reward.win=250
battle.reward.loss=50
battle.compatibility.service.actors.enabled=false
native.integrity.pre-world.probe=true
native.character.event.probe.enabled=false
native.source.selection.probe.enabled=true
attack.all.probe.enabled=false
clone.appearance.probe.enabled=true
administration.accounts=test,test2
