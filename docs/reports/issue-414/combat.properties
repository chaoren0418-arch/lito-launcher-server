# LiTo 戰鬥同源入口（UTF-8）；修改後重啟才生效。
# 基礎技能資料使用 server.properties 的 database.static.database，不在此複製 skills。
# 路徑相對本檔案；直接讀取來源服外控，啟動後保存不可變快照。
# 缺檔、重复鍵、格式錯誤均拒絕載入，不修改來源檔案。
source.skill.file=D:/lineage開發/1-伺服器/config/其他控制端/4-職業_技能設定表.properties
source.damage.file=D:/lineage開發/1-伺服器/config/其他控制端/5-職業傷害設定表.properties
source.character.file=D:/lineage開發/1-伺服器/config/charsettings.properties
source.map.directory=D:/lineage開發/1-伺服器/maps

# ArenaBot 沒有天堂角色列；CON/WIS 為 LiTo 專用素質（整數 1~254）。
# 預設採來源 L1Character 的素質下限 1；只用於表控機率，不回寫任何資料庫。
# 已供候選負面技能／反擊機率使用；完整目標路徑仍在驗收，詳見施工紀錄。
arena.bot.con=1
arena.bot.wis=1
